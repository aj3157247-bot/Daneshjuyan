name: Build Daneshjuyan Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Daneshjuyan-Android/**'
      - '**/Daneshjuyan-Android/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo 'Project folders:'
          find . -maxdepth 6 -name settings.gradle -print
          PROJECT_FILE="$(find . -maxdepth 6 -type f -path '*/Daneshjuyan-Android/settings.gradle' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo '::error::Daneshjuyan-Android/settings.gradle not found. Upload the Android project ZIP contents into this repository, including the Daneshjuyan-Android folder.'
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project located: $PROJECT_DIR"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daneshjuyan-Android-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build Daneshjuyan Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'Daneshjuyan-Android/**'
      - '**/Daneshjuyan-Android/**'
      - 'settings.gradle'
      - 'build.gradle'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project and validate files
        id: project
        shell: bash
        run: |
          set -euo pipefail
          echo 'Checking Android project files...'
          project=''
          if [[ -f settings.gradle && -f app/build.gradle && -f app/src/main/AndroidManifest.xml ]]; then
            project='.'
          else
            while IFS= read -r file; do
              dir="$(dirname "$file")"
              if [[ -f "$dir/app/build.gradle" && -f "$dir/app/src/main/AndroidManifest.xml" ]]; then
                project="$dir"
                break
              fi
            done < <(find . -maxdepth 7 -type f -name settings.gradle -print)
          fi
          if [[ -z "$project" ]]; then
            echo '::error::Android project not found. Expected settings.gradle, app/build.gradle and app/src/main/AndroidManifest.xml together at repository root or inside a subfolder.'
            find . -maxdepth 5 \( -name settings.gradle -o -name build.gradle -o -name AndroidManifest.xml \) -print
            exit 1
          fi
          echo "dir=$project" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $project"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Daneshjuyan-debug-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

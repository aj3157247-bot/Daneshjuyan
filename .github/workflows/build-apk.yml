name: Build Daneshjuyan Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Daneshjuyan-Android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: Daneshjuyan-Android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK with bundled Persian OCR
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Daneshjuyan-Android-debug-APK
          path: Daneshjuyan-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

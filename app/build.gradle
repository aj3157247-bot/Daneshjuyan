plugins { id 'com.android.application' }
android { namespace 'af.daneshjuyan.app'; compileSdk 35
    defaultConfig { applicationId 'af.daneshjuyan.app'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.rmtheis:tess-two:9.1.0'
}
tasks.register('downloadPersianOCR') {
    doLast {
        def dest = file('src/main/assets/tessdata/fas.traineddata')
        if (!dest.exists() || dest.length() < 1000000) {
            dest.parentFile.mkdirs()
            def temp = file(dest.absolutePath + '.download')
            try {
                new URL('https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/fas.traineddata').withInputStream { input ->
                    temp.withOutputStream { output -> output << input }
                }
                if (temp.length() < 1000000) throw new GradleException('Persian OCR model download incomplete')
                java.nio.file.Files.move(temp.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            } finally { temp.delete() }
        }
        if (dest.length() < 1000000) throw new GradleException('Missing or incomplete Persian OCR model')
    }
}
// Ensure the OCR model is present before Android packages assets into the APK.
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(downloadPersianOCR)
    }
}
preBuild.dependsOn(downloadPersianOCR)
